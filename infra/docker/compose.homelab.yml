# Production overlay for the homelab host (PVE CT "apis"). Layers on top of
# the base file; never used for local dev.
#
#   docker compose -f infra/docker/compose.yml -f infra/docker/compose.homelab.yml up -d
#
# Differences from base:
# - IMAGE_TAG is pinned by the deploy pipeline (CI sets it; refuses :local).
# - health-api publishes 3001 on all interfaces so the cloudflared container
#   can reach it across the LAN (tunnel target: http://apps.lab:3001).
# - OTLP endpoint points at the homelab collector (otel.lab is Pi-hole DNS).
services:
  migrate:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel.lab:4318
  health-api:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel.lab:4318
      OTEL_SERVICE_NAME: family-os-health-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=prod
    ports: !override
      - "3001:3001"