x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  family-os-mcp:
    logging: *default-logging
    image: ghcr.io/deeepanshu/family-os-health-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: family-os-mcp
    env_file:
      - ../../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      # Must be the Docker DNS name — do not use host .env 127.0.0.1 (that is the container loopback).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: family-os-mcp
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=prod
    ports:
      - "127.0.0.1:3002:3002"
    restart: unless-stopped
    volumes:
      - ${FAMILY_OS_SECRETS_DIR:?set FAMILY_OS_SECRETS_DIR in .env}:/run/secrets/family-os:ro
    # Migrations run once via compose.prod.yml `migrate` service during deploy — not on MCP start.
    networks:
      - default
      - observability
      - homelab

networks:
  observability:
    external: true
  homelab:
    external: true
