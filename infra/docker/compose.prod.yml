x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-family-os-image: &family-os-image
  image: ghcr.io/deeepanshu/family-os-health-api:${IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: Dockerfile

services:
  # One-shot: docker compose --profile migrate run --rm migrate
  # Safe no-op when schema is already up to date.
  migrate:
    <<: *family-os-image
    logging: *default-logging
    profiles: ["migrate"]
    env_file:
      - ../../.env
    entrypoint: ["/app/scripts/docker-migrate.sh"]
    restart: "no"

  health-api:
    <<: *family-os-image
    logging: *default-logging
    container_name: family-os-health-api
    env_file:
      - ../../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_API:-family-os-health-api}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=prod}
    ports:
      - "3001:3001"
    restart: unless-stopped
    volumes:
      - ${FAMILY_OS_SECRETS_DIR:?set FAMILY_OS_SECRETS_DIR in .env}:/run/secrets/family-os:ro
    networks:
      - default
      - observability

networks:
  observability:
    external: true
