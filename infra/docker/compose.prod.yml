x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  health-api:
    logging: *default-logging
    image: ghcr.io/deeepanshu/family-os-health-api:${IMAGE_TAG:-local}
    # Local/dev only: docker compose build still works when IMAGE_TAG=local and you add --build
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: family-os-health-api
    env_file:
      - ../../.env
    environment:
      HOST: 0.0.0.0
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped
    volumes:
      - ${FAMILY_OS_SECRETS_DIR:?set FAMILY_OS_SECRETS_DIR in .env}:/run/secrets/family-os:ro
