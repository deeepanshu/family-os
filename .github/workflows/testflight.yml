name: TestFlight

run-name: TestFlight ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  start:
    name: Start Xcode Cloud TestFlight
    runs-on: ubuntu-latest
    environment: testflight
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Release TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          XCODE_CLOUD_TARGET: testflight
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
        run: node scripts/start-xcode-cloud.mjs
