name: Deploy Service

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "db/**"
      - "drizzle.config.ts"
      - "scripts/docker-migrate.sh"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "infra/docker/**"
      - ".github/workflows/deploy-service.yml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag to deploy (default: github.sha)"
        required: false
        type: string

concurrency:
  group: deploy-service-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: deeepanshu/family-os-health-api

jobs:
  changes:
    name: Decide build vs deploy
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      deploy: ${{ steps.decide.outputs.deploy }}
      image_tag: ${{ steps.decide.outputs.image_tag }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changes
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          IMAGE_RE='^(apps/api/|packages/shared/|db/|drizzle\.config\.ts$|scripts/docker-migrate\.sh$|package\.json$|package-lock\.json$|Dockerfile$)'
          DEPLOY_RE='^(infra/docker/|\.github/workflows/deploy-service\.yml$)'

          build=false
          deploy=false
          tag="${GITHUB_SHA}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            deploy=true
            if [ -n "${INPUT_TAG}" ]; then
              tag="${INPUT_TAG}"
              echo "Manual deploy of existing tag ${tag} (no build)"
            else
              build=true
              echo "Manual rebuild of ${tag}"
            fi
          else
            if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              build=true
              deploy=true
            else
              CHANGED="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" || true)"
              echo "Changed files:"
              echo "${CHANGED}"
              FILTERED="$(printf '%s\n' "${CHANGED}" | grep -vE '\.mdx?$' || true)"
              if printf '%s\n' "${FILTERED}" | grep -qE "${IMAGE_RE}"; then
                build=true
                deploy=true
              elif printf '%s\n' "${FILTERED}" | grep -qE "${DEPLOY_RE}"; then
                deploy=true
                tag="main"
                echo "Compose/workflow only — deploy existing :main, skip image build"
              fi
            fi
          fi

          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Decision: build=${build} deploy=${deploy} image_tag=${tag}"

  build-and-push:
    name: Build and push amd64 image
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ needs.changes.outputs.image_tag }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via Komodo
    needs: [changes, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.changes.outputs.build != 'true' || needs.build-and-push.result == 'success') &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Pin IMAGE_TAG and deploy stack
        env:
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag || needs.changes.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "${KOMODO_API_KEY}" ] || [ -z "${KOMODO_API_SECRET}" ]; then
            echo "Missing KOMODO_API_KEY or KOMODO_API_SECRET" >&2
            exit 1
          fi

          komodo() {
            local path="$1"
            local body="$2"
            curl -fsS --max-time 120 -X POST \
              "https://komodo.deepanshujain.me${path}" \
              -H "content-type: application/json" \
              -H "x-api-key: ${KOMODO_API_KEY}" \
              -H "x-api-secret: ${KOMODO_API_SECRET}" \
              -d "${body}"
            echo
          }

          # Compose-only deploys keep the current SHA (tag is "main" as a sentinel).
          if [ "${IMAGE_TAG}" != "main" ]; then
            echo "FAMILY_OS_IMAGE_TAG=${IMAGE_TAG}"
            komodo /write "$(jq -nc --arg v "${IMAGE_TAG}" \
              '{type:"UpdateVariableValue",params:{name:"FAMILY_OS_IMAGE_TAG",value:$v}}')"
          else
            echo "Compose-only deploy; leaving FAMILY_OS_IMAGE_TAG unchanged"
          fi

          echo "DeployStack family-os"
          komodo /execute "$(jq -nc \
            '{type:"DeployStack",params:{stack:"family-os"}}')"


  notify:
    name: ntfy
    needs: [changes, build-and-push, deploy]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Publish ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BUILD: ${{ needs.build-and-push.result }}
          DEPLOY: ${{ needs.deploy.result }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag || needs.changes.outputs.image_tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "NTFY_TOPIC secret not set; skipping"
            exit 0
          fi

          if [ "${DEPLOY}" = "success" ]; then
            status=success
            title="family-os deploy ok"
            prio=default
            tags="white_check_mark"
          elif [ "${BUILD}" = "failure" ]; then
            status=failed
            title="family-os image build failed"
            prio=high
            tags="x"
          else
            status=failed
            title="family-os deploy failed"
            prio=high
            tags="x"
          fi

          body="status=${status} tag=${IMAGE_TAG} sha=${SHA:0:12} build=${BUILD} deploy=${DEPLOY}"
          curl -fsS --max-time 15 -X POST "https://ntfy.sh/${NTFY_TOPIC}" \
            -H "Title: ${title}" \
            -H "Priority: ${prio}" \
            -H "Tags: ${tags}" \
            -H "Click: https://komodo.deepanshujain.me/" \
            -d "${body}"
          echo "ntfy ${status}"

