name: Deploy Service

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "db/**"
      - "drizzle.config.ts"
      - "scripts/docker-migrate.sh"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "infra/docker/**"
      - "grafana/dashboards/**"
      - "scripts/sync-grafana-dashboards.sh"
      - ".github/workflows/deploy-service.yml"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag to deploy (default: github.sha)"
        required: false
        type: string

jobs:
  deploy:
    uses: deeepanshu/homelab-ci/.github/workflows/komodo-deploy.yml@main
    permissions:
      contents: read
      packages: write
    with:
      stack: family-os
      image_name: deeepanshu/family-os-health-api
      image_tag_variable: FAMILY_OS_IMAGE_TAG
      image_path_regex: '^(apps/api/|packages/shared/|db/|drizzle\.config\.ts$|scripts/docker-migrate\.sh$|package\.json$|package-lock\.json$|Dockerfile$)'
      deploy_path_regex: '^(infra/docker/|grafana/dashboards/|scripts/sync-grafana-dashboards\.sh$|\.github/workflows/deploy-service\.yml$)'
      caller_event: ${{ github.event_name }}
      caller_before: ${{ github.event.before }}
      image_tag: ${{ github.event.inputs.image_tag }}
    secrets: inherit
