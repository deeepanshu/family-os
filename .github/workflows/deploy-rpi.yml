name: Deploy RPi

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "db/**"
      - "drizzle.config.ts"
      - "scripts/docker-migrate.sh"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "infra/docker/**"
      - ".github/workflows/deploy-rpi.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag to deploy (default: github.sha)"
        required: false
        type: string

concurrency:
  group: deploy-rpi-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: deeepanshu/family-os-health-api

jobs:
  build-and-push:
    name: Build and push arm64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on Pi via manager
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy and wait for Pi success
        env:
          DEPLOY_SECRET: ${{ secrets.RPI_DEPLOY_SECRET }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          # Short curl per request; overall wait is the poll loop (~15 min).
          POLL_INTERVAL: "10"
          MAX_ATTEMPTS: "90"
          CURL_MAX_TIME: "30"
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SECRET}" ]; then
            echo "Missing repo secret RPI_DEPLOY_SECRET" >&2
            exit 1
          fi

          # rpi-manager allowlists main. Pre-merge workflow_dispatch from a feature
          # branch still deploys the built image_tag/sha; report ref as main for the hook.
          HOOK_REF="${GITHUB_REF}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Pre-merge deploy from ${GITHUB_REF}; using refs/heads/main for manager allowlist"
            HOOK_REF="refs/heads/main"
          fi
          RESP="$(curl -fsS --max-time 60 -X POST \
            "https://manager.deepanshujain.me/hooks/deploy/family-os" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${DEPLOY_SECRET}" \
            -d "$(jq -nc \
              --arg ref "${HOOK_REF}" \
              --arg sha "${GITHUB_SHA}" \
              --arg tag "${IMAGE_TAG}" \
              --arg repo "${GITHUB_REPOSITORY}" \
              '{ref:$ref, sha:$sha, image_tag:$tag, repository:$repo}')")"
          echo "${RESP}"
          DEPLOY_ID="$(echo "${RESP}" | jq -r '.deploy_id // empty')"
          if [ -z "${DEPLOY_ID}" ] || [ "${DEPLOY_ID}" = "null" ]; then
            echo "Hook response missing deploy_id" >&2
            exit 1
          fi
          echo "Waiting for deploy_id=${DEPLOY_ID} tag=${IMAGE_TAG}"

          STATUS_URL="https://manager.deepanshujain.me/api/deploys/${DEPLOY_ID}"
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            body="$(curl -fsS --max-time "${CURL_MAX_TIME}" \
              -H "X-Deploy-Secret: ${DEPLOY_SECRET}" \
              -H "Accept: application/json" \
              "${STATUS_URL}" 2>/dev/null || true)"
            if [ -z "${body}" ]; then
              echo "[${attempt}/${MAX_ATTEMPTS}] poll error; retrying…"
              sleep "${POLL_INTERVAL}"
              continue
            fi
            status="$(echo "${body}" | jq -r '.status // empty')"
            message="$(echo "${body}" | jq -r '.message // empty')"
            echo "[${attempt}/${MAX_ATTEMPTS}] status=${status} ${message}"
            case "${status}" in
              success)
                echo "Deploy ${DEPLOY_ID} succeeded"
                exit 0
                ;;
              failed|rejected)
                echo "Deploy ${DEPLOY_ID} ${status}" >&2
                exit 1
                ;;
              *)
                sleep "${POLL_INTERVAL}"
                ;;
            esac
          done
          echo "Deploy ${DEPLOY_ID} timed out" >&2
          exit 1
