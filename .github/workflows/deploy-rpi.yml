name: Deploy RPi

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "db/**"
      - "drizzle.config.ts"
      - "scripts/docker-migrate.sh"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "infra/docker/**"
      - ".github/workflows/deploy-rpi.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag to deploy (default: github.sha)"
        required: false
        type: string

concurrency:
  group: deploy-rpi-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: deeepanshu/family-os-health-api

jobs:
  build-and-push:
    name: Build and push arm64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on Pi via manager
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Call rpi-manager deploy hook
        env:
          DEPLOY_SECRET: ${{ secrets.RPI_DEPLOY_SECRET }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SECRET}" ]; then
            echo "Missing repo secret RPI_DEPLOY_SECRET" >&2
            exit 1
          fi
          curl -fsS -X POST "https://manager.deepanshujain.me/hooks/deploy/family-os" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Secret: ${DEPLOY_SECRET}" \
            -d "$(jq -nc \
              --arg ref "${GITHUB_REF}" \
              --arg sha "${GITHUB_SHA}" \
              --arg tag "${IMAGE_TAG}" \
              --arg repo "${GITHUB_REPOSITORY}" \
              '{ref:$ref, sha:$sha, image_tag:$tag, repository:$repo}')"
          echo
          echo "Deploy accepted for tag ${IMAGE_TAG}"
