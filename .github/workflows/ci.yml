name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

  api:
    name: API Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://family_os:family_os@localhost:5432/family_os
      HEALTH_API_REPOSITORY: postgres
      HEALTH_API_SYNC_LOCAL_AUTH_USERS: "true"
      SUPABASE_URL: https://project.supabase.co
      SUPABASE_JWT_SECRET: test-supabase-jwt-secret-with-enough-length
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Run local migrations
        run: npm run db:migrate:local

      - name: Typecheck API
        run: npm run typecheck -w @family-os/health-api

      - name: Test API
        run: npm run test -w @family-os/health-api

      - name: Stop Postgres
        if: always()
        run: docker compose down

  drizzle:
    name: Drizzle Migrations
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://family_os:family_os@localhost:5432/family_os
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Check migrations
        run: npm run db:check

      - name: Detect uncommitted migration drift
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "Uncommitted Drizzle migration output detected. Run 'npm run db:generate' locally and commit the results."
            git status --short db/migrations
            exit 1
          fi

      - name: Stop Postgres
        if: always()
        run: docker compose down

